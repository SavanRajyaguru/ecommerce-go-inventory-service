syntax = "proto3";

package inventory;

option go_package = "github.com/savanrajyaguru/ecommerce-go-inventory-service/proto";

service InventoryService {
  rpc ReserveStock (ReserveStockRequest) returns (ReserveStockResponse);
}

message ReserveStockRequest {
  uint32 product_id = 1;
  int32 quantity = 2;
}

message ReserveStockResponse {
  bool success = 1;
  string message = 2;
}
